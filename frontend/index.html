        <!-- Apply saved theme (default: light) before first paint to avoid a flash -->
        <script>
            (function () {
                try {
                    var t = "light";
                    var s = localStorage.getItem("reflexity-theme");
                    if (s) { var p = JSON.parse(s); if (p && p.state && p.state.theme) t = p.state.theme; }
                    document.documentElement.classList.add(t);
                } catch (e) { document.documentElement.classList.add("light"); }
            })();
        </script>

        <meta name="theme-color" content="#f4f4f6" />
